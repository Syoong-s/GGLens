# Copy to esd.ini in the run directory, or set FQ_GGLENS_INI to its path.
# Omitted keys retain the corresponding defaults in esd_defaults.hpp.

[run]
group-list = group_catalogs.list
shear-list = shear_catalogs.list
output = ESD_results.dat
# cache = lens_cache.dat
# scratch-dir = .bcg_scratch
memory-mb = 512

[measurement]
center = bcg
z-min = 0.3
z-max = 0.4
logm-min = 13.0
logm-max = 14.2
r-min = 0.1
r-max = 5.0
n-r-bins = 10
dz-min = 0.2
omega-m = 0.315
h = 0.674
sigma8 = 0.811
omega-b-h2 = 0.02237
spectral-index = 0.965
neutrino-mass = 0.06
n-jack = 400
pdf-bins = 4

[calibration]
# Set fd-corrected for catalogs whose g1/g2 already have the FD signal removed.
fd-corrected = false
self-calibrate = false
m1 = 0
m2 = 0
c1 = 0
c2 = 0
# Half-width for the source FD cut and the self-calibration grid.
gf-lim = 0.0015
selfcal-fd-bins = 21
selfcal-pdf-bins = 4
selfcal-min-count = 6
selfcal-search-width = 0.2

[external_columns]
# One-based catalog positions. Change mag to select a band.
ra = 5
dec = 6
zp = 17
mag = 11
ext-mash = 4
# Set expo-num to the exposure ID column when expo-bar-mltp >= -999.0.
expo-num = 0
# -1 selects the last column, where the standard combined catalog places exposure chi2.
expo-chi2 = -1

[cuts]
# Values below -999.0 disable the cut. Values at or above -999.0 are active.
snrfcut = 0
snrlow = 0
snrhigh = 0
starcut = 16
chi2-thresh = 0.01
flagcut = 0
zplow = 0
zphigh = 5
imaxcut = 64
jmaxcut = 64
mag-low = 0
mag-high = 25
psf-chi2-mltp = 3
r-half-thresh = 0
ext-cut = -4
max-dup = 5
star-bar-mltp = -3
expo-bar-mltp = -3

[fit]
walkers = 72
steps = 10000
burn-in = 1000
ensembles = 4
seed = 12771
profile-draws = 4096
# python-path = /path/to/optional/Python/site-packages

[plots]
# esd-plot = ESD_results_fit.png
# title = BCG-centered group lensing
