name: Publish source release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package source
        id: package
        shell: bash
        run: |
          package="FQ_GGLens-${GITHUB_REF_NAME}"
          archive="${RUNNER_TEMP}/${package}.tar.gz"
          git archive --format=tar.gz --prefix="${package}/" --output="$archive" HEAD
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          tag="$GITHUB_REF_NAME"
          if release=$(gh release view "$tag" --json assets,isDraft); then
            if ! jq -e --arg name "${ARCHIVE##*/}" 'any(.assets[]; .name == $name)' <<< "$release" >/dev/null; then
              gh release upload "$tag" "$ARCHIVE"
            fi
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              gh release edit "$tag" --draft=false
            fi
          else
            gh release create "$tag" "$ARCHIVE" --verify-tag --generate-notes
          fi
