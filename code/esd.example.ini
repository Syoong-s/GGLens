# Pass this file's path to esd_bcg_mpi, or copy it to esd.ini in the run directory.
# Omitted keys use the built-in defaults.

[run]
stage = all
group-list = group_catalogs.list
shear-list = shear_catalogs.list
output-dir = results
output = ESD_results.dat
# cache = lens_cache.dat
# scratch-dir = .bcg_scratch
memory-mb = 512

[measurement]
center = bcg
z-min = 0.3
z-max = 0.4
logm-min = 13.0
logm-max = 14.2
r-min = 0.1
r-max = 100.0
n-r-bins = 12
dz-min = 0.2
omega-m = 0.315
h = 0.674
sigma8 = 0.811
omega-b-h2 = 0.02237
spectral-index = 0.965
neutrino-mass = 0.06
n-jack = 400
pdf-bins = 4

[group_columns]
# One-based positions. Negative positions count backward from the last column.
# Set id = 0 to use the one-based data row number instead.
id = 1
redshift = 5
log-halo-mass = 6
mass-format = log10
delimiter = whitespace
header = false

[galaxy_columns]
# Set id = 0 to use the one-based data row number instead.
id = 1
ra = 2
dec = 3
# LWC uses luminosity. BCG uses stellar mass and optional photometry selection.
luminosity = 6
log-stellar-mass = 10
photometry-select = 15
mass-format = log10
delimiter = whitespace
header = false

[member_columns]
galaxy-id = 1
group-id = 2
# The flag column and its integer value are used for BCG.
brightest-flag = 3
brightest-value = 1
delimiter = whitespace
header = false

[calibration]
# Set fd-corrected for catalogs whose g1/g2 already have the FD signal removed.
fd-corrected = false
self-calibrate = true
m1 = 0
m2 = 0
c1 = 0
c2 = 0
# Half-width for the source FD cut and the self-calibration grid.
gf-lim = 0.0015
selfcal-fd-bins = 21
selfcal-pdf-bins = 4
selfcal-min-count = 6
selfcal-search-width = 0.2

[external_columns]
# One-based catalog positions. Change mag to select a band.
ra = 5
dec = 6
zp = 17
mag = 11
ext-mash = 4
# Set expo-num to the exposure ID column when expo-bar-mltp >= -999.0.
expo-num = 0
# Set ccd-num to the CCD ID column when using ccd-cut.
ccd-num = 0
# -1 selects the last column, where the standard combined catalog places exposure chi2.
expo-chi2 = -1

[cuts]
# Thresholds below -999.0 disable their cut. Values at or above -999.0 are active.
snrfcut = -9999.0
snrlow = 10
snrhigh = -9999.0
starcut = 16
chi2-thresh = 0.01
flagcut = -9999.0
zplow = 0
zphigh = 5
imaxcut = 64
jmaxcut = 64
mag-low = 10
mag-high = 30
psf-chi2-mltp = -9999.0
r-half-thresh = -9999.0
ext-cut = -9999.0
max-dup = 5
star-bar-mltp = -9999.0
expo-bar-mltp = -9999.0
# Replace the disabled value with a comma-separated list, for example 2, 31, 53, 61.
ccd-cut = -9999.0

[fit]
# In stage = fit, override the input to reuse a measurement from another run.
# input = results/measurement/ESD_results_fit_input.dat
walkers = 72
steps = 10000
burn-in = 1000
ensembles = 4
seed = 12771
profile-draws = 4096
# python-path = /path/to/optional/Python/site-packages

[plots]
# esd-plot = ESD_results_fit.png
# title = BCG-centered group lensing
