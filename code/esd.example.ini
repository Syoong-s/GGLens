# Pass this file to esd_bcg_mpi or copy it to esd.ini in the launch directory.
# Relative paths start from the launch directory. Commented settings use the built-in defaults.
# Use single or double quotes around values that contain a literal hash (#).

[run]
stage = all                               # Run all stages or select measure, fit, or pull.
group-list = group_catalogs.list          # List of Group, Galaxy, and Member catalog sets.
shear-list = shear_catalogs.list          # List of Fourier Quad shear catalogs.
output-dir = results                      # Root directory for the measurement, fit, and final outputs.
output = ESD_results.dat                  # ESD table name and prefix for derived outputs.
# cache = lens_cache.dat                  # Optional file for saving and reusing resolved lens centers.
# scratch-dir = .bcg_scratch              # Temporary workspace. Defaults to .bcg_scratch under the result root.
memory-mb = 512                           # Buffer budget in MiB per MPI rank, with a minimum of 64.

[measurement]
center = bcg                              # Group center. Choose bcg, lwc, or nwc.
z-min = 0.3                               # Inclusive lower group redshift limit.
z-max = 0.4                               # Exclusive upper group redshift limit.
logm-min = 13.0                           # Inclusive lower log10 halo mass limit in solar masses divided by h.
logm-max = 14.2                           # Exclusive upper log10 halo mass limit in the same units.
r-min = 0.1                               # Inclusive minimum projected radius in comoving Mpc/h.
r-max = 100.0                             # Exclusive maximum projected radius in comoving Mpc/h.
n-r-bins = 12                             # Number of logarithmic radial bins.
dz-min = 0.2                              # Require source photo-z minus group redshift to exceed this value.
omega-m = 0.315                           # Present-day total matter density fraction.
h = 0.674                                 # Hubble constant in units of 100 km/s/Mpc.
sigma8 = 0.811                            # Present-day fluctuation amplitude at 8 comoving Mpc/h.
omega-b-h2 = 0.02237                      # Physical baryon density, Omega_b times h squared.
spectral-index = 0.965                    # Scalar spectral index of the primordial power spectrum.
neutrino-mass = 0.06                      # Total neutrino mass in eV.
n-jack = 400                              # Target number of Jackknife sky regions.
pdf-bins = 4                              # Number of PDF_SYM magnitude bin boundaries for ESD.

# Group, Galaxy, and Member column positions start at 1. Use -1 for the last column.
[group_columns]
id = 1                                    # Group ID column. Use 0 to use the one-based data row number.
redshift = 5                              # Group redshift column.
log-halo-mass = 6                         # Halo mass column in the representation selected by mass-format.
mass-format = log10                       # Halo mass representation. Choose log10 or linear.
delimiter = whitespace                    # Column separator. Choose whitespace, comma, or tab.
header = false                            # Set true to skip the first line of each Group catalog.

[galaxy_columns]
id = 1                                    # Galaxy ID column. Use 0 to use the one-based data row number.
ra = 2                                    # Galaxy right ascension column in degrees.
dec = 3                                   # Galaxy declination column in degrees.
luminosity = 6                            # Luminosity column used to weight LWC centers.
log-stellar-mass = 10                     # Stellar mass column for BCGs in the representation selected by mass-format.
photometry-select = 15                    # Column used to report BCG photometry selection. Use 0 to omit the statistic.
mass-format = log10                       # Stellar mass representation. Choose log10 or linear.
delimiter = whitespace                    # Column separator. Choose whitespace, comma, or tab.
header = false                            # Set true to skip the first line of each Galaxy catalog.

[member_columns]
galaxy-id = 1                             # Column linking each membership row to a Galaxy ID.
group-id = 2                              # Column linking each membership row to a Group ID.
brightest-flag = 3                        # Flag column used to identify the brightest galaxy in each group.
brightest-value = 1                       # Flag value identifying a BCG.
delimiter = whitespace                    # Column separator. Choose whitespace, comma, or tab.
header = false                            # Set true to skip the first line of each Member catalog.

[calibration]
fd-corrected = false                      # Set true if field distortion was already subtracted from catalog g1 and g2.
self-calibrate = true                     # Estimate the shear calibration from this run's matched sources.
# m1 = 0                                  # Manual multiplicative bias for g1 when self-calibrate is false.
# m2 = 0                                  # Manual multiplicative bias for g2 when self-calibrate is false.
# c1 = 0                                  # Manual additive bias for g1 when self-calibrate is false.
# c2 = 0                                  # Manual additive bias for g2 when self-calibrate is false.
gf-lim = 0.0015                           # Maximum absolute FD per component and half-width of the self-calibration grid.
selfcal-fd-bins = 21                      # Number of field-distortion intervals per component.
selfcal-pdf-bins = 4                      # Number of PDF_SYM magnitude bins for each FD interval.
selfcal-min-count = 6                     # Minimum number of source rows required in an FD interval.
selfcal-search-width = 0.2                # Initial shear search half-width in each FD interval.

# External columns use the one-based positions in the combined shear catalog.
[external_columns]
ra = 5                                    # Source right ascension column in degrees.
dec = 6                                   # Source declination column in degrees.
zp = 17                                   # Source photometric redshift column.
mag = 11                                  # Magnitude column used for magnitude and stellar-locus cuts.
ext-mash = 4                              # Morphology column used by ext-cut.
# expo-num = 0                            # Exposure ID column. Set a positive position to use expo-bar-mltp.
# ccd-num = 0                             # CCD ID column. Set a positive position to use ccd-cut.
expo-chi2 = -1                            # Exposure chi-squared column. Use -1 for the last column.

# Thresholds below -999.0 disable their cut. Values at or above -999.0 are active.
[cuts]
# snrfcut = -9999.0                       # Minimum Fourier-space SNR from the snr_f column.
snrlow = 10                               # Minimum half-light flux divided by the square root of half-light area.
# snrhigh = -9999.0                       # Maximum half-light flux divided by the square root of half-light area.
starcut = 16                              # Minimum number of stars used for PSF modeling.
chi2-thresh = 0.01                        # Maximum exposure chi-squared.
# flagcut = -9999.0                       # Maximum product of the flag and sigma columns.
zplow = 0                                 # Exclusive lower source photo-z limit.
zphigh = 5                                # Exclusive upper source photo-z limit.
imaxcut = 64                              # Exclusive upper limit for the imax stamp index.
jmaxcut = 64                              # Exclusive upper limit for the jmax stamp index.
mag-low = 10                              # Inclusive lower magnitude limit in the selected band.
mag-high = 30                             # Inclusive upper magnitude limit in the selected band.
# psf-chi2-mltp = -9999.0                 # Maximum PSF polynomial-fit chi-squared.
# r-half-thresh = -9999.0                 # Require the source half-light diameter to PSF FWHM ratio to exceed this.
# ext-cut = -9999.0                       # Keep morphology values within 0.001 of this value.
max-dup = 5                               # Reject adjacent same-position blocks containing more than this many rows.
# star-bar-mltp = -9999.0                 # Scatter multiplier above the global stellar locus for star rejection.
# expo-bar-mltp = -9999.0                 # Scatter multiplier for per-exposure star rejection, which takes precedence.
# ccd-cut = -9999.0                       # Comma-separated CCD IDs to exclude, such as 2, 31, 53, 61.

[fit]
# input = results/measurement/ESD_results_measurement.bin # Measurement input for fit, or its relocated path for pull.
walkers = 72                              # Number of MCMC walkers per ensemble. Use an even number of at least 10.
steps = 10000                             # Total MCMC steps per walker.
burn-in = 1000                            # Initial steps discarded from each walker.
ensembles = 4                             # Number of independent MCMC ensembles.
seed = 12771                              # Nonnegative random seed for the fit.
profile-draws = 4096                      # Maximum number of retained samples used for profile bands.
# python-path = /path/to/site-packages    # Optional directory with Python packages for fit and pull.

[plots]
# esd-plot = ESD_results_fit.png          # Output PNG path for the ESD plot. Relative to output-dir when set.
# title = BCG-centered group lensing      # ESD figure title. Defaults to a title based on the chosen center.
